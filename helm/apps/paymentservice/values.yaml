replicaCount: 1

image:
  repository: 333982363119.dkr.ecr.us-west-2.amazonaws.com/boutique-paymentservice
# TODO: Replace with the actual image tag after CI builds and pushes to ECR.
  tag: REPLACE_WITH_BUILT_GIT_SHA

service:
  type: ClusterIP
  port: 50051
  targetPort: 50051

serviceAccount:
  create: true
  name: paymentservice
  automountServiceAccountToken: true

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "paymentservice"
  vault.hashicorp.com/agent-inject-secret-payment-config: "secret/data/paymentservice/config"

containerEnvVars:
  - name: PORT
    value: "50051"

  - name: DISABLE_PROFILER
    value: "1"
