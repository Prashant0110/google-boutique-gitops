replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice
  tag: v0.10.2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 50051
  targetPort: 50051

serviceAccount:
  create: true
  name: paymentservice
  automountServiceAccountToken: true

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "paymentservice"
  vault.hashicorp.com/agent-inject-secret-payment-config: "secret/data/paymentservice/config"

containerEnvVars:
  - name: PORT
    value: "50051"

  - name: DISABLE_PROFILER
    value: "1"
