apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - ecommerce-prod

  selector:
    matchLabels:
      app: frontend

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
