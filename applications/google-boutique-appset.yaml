apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: google-boutique
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: https://github.com/Prashant0110/google-boutique-gitops.git
        revision: feat/apex-assessment
        directories:
          - path: helm/apps/frontend
          - path: helm/apps/paymentservice

  template:
    metadata:
      name: "{{path.basename}}"

      labels:
        app.kubernetes.io/part-of: google-boutique

    spec:
      project: default

      source:
        repoURL: https://github.com/Prashant0110/google-boutique-gitops.git
        targetRevision: feat/apex-assessment
        path: "{{path}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: ecommerce-prod

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true