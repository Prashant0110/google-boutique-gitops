apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater

metadata:
  name: google-boutique
  namespace: argocd

spec:
  commonUpdateSettings:
    updateStrategy: newest-build
    ignoreTags:
    - latest

  writeBackConfig:
    method: git
    gitConfig:
      branch: main
      writeBackTarget: helmvalues

  applicationRefs:
  - namePattern: "frontend"

    labelSelectors:
      matchLabels:
        image-updater: "true"

    images:
    - alias: frontend
      imageName: 333982363119.dkr.ecr.us-west-2.amazonaws.com/boutique-frontend

      commonUpdateSettings:
        updateStrategy: newest-build
        ignoreTags:
        - latest

      manifestTargets:
        helm:
          name: image.repository
          tag: image.tag
