apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-api
  namespace: retrieval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retrieval-api
  template:
    metadata:
      labels:
        app: retrieval-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "retrieval"
        vault.hashicorp.com/agent-inject-secret-api-key: "secret/data/retrieval/config"
        vault.hashicorp.com/agent-inject-template-api-key: |
          {{- with secret "secret/data/retrieval/config" -}}
          {{ .Data.data.api_key }}
          {{- end }}
    spec:
      serviceAccountName: retrieval-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: apex-retrieval:assessment-cpu-20261023
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: QDRANT_URL
              value: http://qdrant.retrieval.svc.cluster.local:6333
            - name: QDRANT_COLLECTION
              value: knowledge
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-api
  namespace: retrieval
spec:
  type: ClusterIP
  selector:
    app: retrieval-api
  ports:
    - name: http
      port: 8000
      targetPort: http
