image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.105.0"

ports:
  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

    prometheus:
      config:
        scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 10s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8889

  # 1. Added ServiceGraph Connector
  connectors:
    servicegraph:
      latency_histogram_buckets: [2ms, 8ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s, 10s]
      dimensions: []
      store:
        ttl: 2s
        max_items: 1000

  processors:
    batch:
      send_batch_size: 8192
      timeout: 200ms

  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true

    # 2. Added Prometheus Exporter to serve service graph metrics on port 8889
    prometheus:
      endpoint: "0.0.0.0:8889"
      namespace: ""

    debug: {}

  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888 # Shifted internal telemetry to 8888 to avoid port collision with 8889

    pipelines:
      # 3. Added 'servicegraph' connector as an exporter target for traces
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo, debug, servicegraph]

      # 4. Added new pipeline to output ServiceGraph metrics to Prometheus
      metrics/servicegraph:
        receivers: [servicegraph]
        processors: [batch]
        exporters: [prometheus]
