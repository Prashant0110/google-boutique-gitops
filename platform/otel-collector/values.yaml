mode: deployment

image:
  repository: "otel/opentelemetry-collector-contrib"
  tag: "0.105.0"

# 1. Turn off the default prometheus scraper injected by the Helm chart
prometheus:
  enabled: false

# 2. Re-bind or disable internal chart metrics port
ports:
  metrics:
    enabled: false

config:
  # 3. Explicitly set telemetry address to 8889 inside collector config
  service:
    telemetry:
      metrics:
        address: ":8889"
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - otlp/tempo
      logs:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - otlp/tempo

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  processors:
    batch:
      send_batch_size: 8192
      timeout: 200ms

  exporters:
    otlp/tempo:
      endpoint: "tempo.monitoring.svc.cluster.local:4317"
      tls:
        insecure: true
