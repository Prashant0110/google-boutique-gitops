mode: deployment

image:
  repository: "otel/opentelemetry-collector-contrib"
  tag: "0.105.0"

config:
  service:
    telemetry:
      metrics:
        address: ":8889"

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  processors:
    batch:
      send_batch_size: 8192
      timeout: 200ms

  exporters:
    otlp/tempo:
      endpoint: "tempo.monitoring.svc.cluster.local:4317"
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - otlp/tempo
      logs:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - otlp/tempo
